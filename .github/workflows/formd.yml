name: Daily Form D pages
on:
  schedule:
    - cron: '30 23 * * 1-5'
    - cron: '0 15 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: formd
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/formd/build.mjs
      - name: Commit
        run: |
          git config user.name "skillmerc-bot"
          git config user.email "kyle@skillmerc.com"
          git add -A _data/formd form-d sitemap.xml
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Form D pages $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - name: Request a Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/pages/builds || true
